[package]
name = "cce-secrets"
version = "0.1.0"
edition = "2021"

[dependencies]
cce-ui = { git = "https://github.com/lsgalante/cce-ui.git", rev = "8007f9efb61e3a1892e581f0dd8290ae467206d5" }
calloop = "0.13.0"
wayland-client = { version = "0.31", features = ["system"] }
tokio = { version = "1", features = ["full"] }
secret-service = { version = "5", features = ["rt-tokio-crypto-rust"] }
zbus = "5"
log = "0.4"
env_logger = "0.11"
# cce-keyring-sync only:
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
getrandom = "0.2"
rustix = { version = "0.38", features = ["fs"] }
