[package]
name = "cce-secrets"
version = "0.1.0"
edition = "2021"

[dependencies]
cce-ui = { git = "https://git.lucas.co/cce-ui.git", rev = "769b31250d19fe5ef36a38adbebbaaebafd024fa" }
calloop = "0.13.0"
wayland-client = { version = "0.31", features = ["system"] }
tokio = { version = "1", features = ["full"] }
secret-service = { version = "5", features = ["rt-tokio-crypto-rust"] }
zbus = "5"
log = "0.4"
env_logger = "0.11"
# cce-keyring-sync only:
keepass = { version = "0.13", features = ["save_kdbx4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
rpassword = "7"
getrandom = "0.2"
rustix = { version = "0.38", features = ["fs"] }
