[package]
name = "cce-secrets"
version = "0.1.0"
edition = "2021"

[dependencies]
cce-ui = { git = "https://github.com/lsgalante/cce-ui.git", rev = "ee351a05991bb2b0665f2cf4bc7c3ded7332eb76" }
calloop = "0.13.0"
wayland-client = { version = "0.31", features = ["system"] }
tokio = { version = "1", features = ["full"] }
secret-service = { version = "5", features = ["rt-tokio-crypto-rust"] }
zbus = "5"
log = "0.4"
env_logger = "0.11"
# cce-keyring-sync only:
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
getrandom = "0.2"
rustix = { version = "0.38", features = ["fs"] }
